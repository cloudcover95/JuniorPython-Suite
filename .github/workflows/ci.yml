name: CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - run: pip install -e . pytest ruff black
    - run: ruff check .
    - run: black --check .
    - run: pytest tests/ -q
    - run: python -c "from src.bitnet_runner import BitNetRunner; print('BitNet ready')"
